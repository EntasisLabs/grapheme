[package]
name = "grapheme-sdk"
version = "0.3.1"
edition = "2021"
description = "Embedded SDK for compiling and executing Grapheme workflows"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[features]
default = []
wasix-runtime = ["grapheme-runtime/wasix-runtime"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.2.0" }
grapheme-compiler = { path = "../grapheme-compiler", version = "0.3.0" }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.3.1" }
grapheme-signatures = { path = "../grapheme-signatures", version = "0.3.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.3.0" }
