[package]
name = "grapheme-compiler"
version = "0.3.0"
edition = "2021"
description = "Compiler pipeline for Grapheme source to MIR artifacts"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[dependencies]
pest = "=2.7.15"
pest_derive = "=2.7.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.2.0" }
grapheme-signatures = { path = "../grapheme-signatures", version = "0.3.0" }
