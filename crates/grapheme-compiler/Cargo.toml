[package]
name = "grapheme-compiler"
version = "0.7.1"
edition = "2024"
rust-version = "1.92"
description = "Compiler pipeline for Grapheme source to MIR artifacts"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[features]
default = ["stage-b"]
stage-b = ["dep:grapheme-aot-container"]
full = ["stage-b", "grapheme-signatures/full"]
data = ["grapheme-signatures/data"]
pdf = ["grapheme-signatures/pdf"]
image = ["grapheme-signatures/image"]
plot = ["grapheme-signatures/plot"]
media = ["grapheme-signatures/media"]

[dependencies]
pest = "=2.7.15"
pest_derive = "=2.7.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.3.0" }
grapheme-aot-container = { path = "../grapheme-aot-container", version = "0.7.1", optional = true }
grapheme-signatures = { path = "../grapheme-signatures", version = "0.7.1", default-features = false }
