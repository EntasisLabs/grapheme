[package]
name = "grapheme-runtime"
version = "0.7.2"
edition = "2024"
rust-version = "1.94"
description = "Policy-governed Grapheme runtime engine"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[features]
default = ["stage-b"]
stage-b = ["dep:grapheme-aot-container"]
full = [
    "stage-b",
    "data",
    "pdf",
    "image",
    "plot",
    "media",
    "grapheme-signatures/full",
]
data = ["grapheme-signatures/data"]
pdf = ["grapheme-signatures/pdf"]
image = ["grapheme-signatures/image"]
plot = ["grapheme-signatures/plot"]
media = ["grapheme-signatures/media"]
wasix-runtime = ["dep:wasmer-wasix", "dep:wasmer", "dep:wasmer-types", "dep:tokio", "dep:rustls-webpki", "dep:rustls", "dep:webpki-root-certs", "wasmer/sys", "wasmer/cranelift"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.3.0" }
grapheme-aot-container = { path = "../grapheme-aot-container", version = "0.7.2", optional = true }
grapheme-signatures = { path = "../grapheme-signatures", version = "0.7.2", default-features = false }
wasmer = { version = "7.2.0-alpha.2", optional = true, default-features = false }
wasmer-types = { version = "7.2.0-alpha.2", optional = true }
wasmer-wasix = { version = "0.702.0-alpha.2", optional = true, default-features = false, features = ["sys-default"] }
# RUSTSEC-2026-0386.
tokio = { version = "1.53.3", optional = true, features = ["rt-multi-thread"] }
# RUSTSEC-2026-0382. wasmer-wasix pulls reqwest 0.13 -> rustls, whose range
# still allows rustls-webpki 0.103.13.
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
# RUSTSEC-2026-0285 / 0346 / 0348 / 0349. Same reqwest edge still allows
# rustls 0.23.40. 0.23.46 is the patched floor. default-features stays off
# so wasm builds keep ring.
rustls = { version = "0.23.46", default-features = false, optional = true }
# RUSTSEC-2026-0383. Wasm root store behind rustls-platform-verifier.
webpki-root-certs = { version = "1.0.11", optional = true }

[dev-dependencies]
grapheme-signatures = { path = "../grapheme-signatures", version = "0.7.2", features = ["full"] }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.7.2", features = ["full"] }
wat = "1"
