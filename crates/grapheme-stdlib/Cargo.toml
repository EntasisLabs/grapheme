[package]
name = "grapheme-stdlib"
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
description = "Standard library operation implementations for Grapheme"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[features]
# Host stack on by default so CLI/SDK keep http/sql/email without new opt-in.
# Use `--no-default-features --features wasm` for wasm32-wasip1 / Stage B work.
default = ["host"]
# Wasm-safe profile: core/json always + csv/yaml/html transforms.
wasm = ["transforms"]
transforms = ["dep:csv", "dep:serde_yaml", "dep:html-to-markdown-rs"]
host = ["transforms", "http", "web", "net", "email", "sql", "surreal"]
http = ["dep:ehttp"]
web = ["dep:websearch", "http", "dep:tokio", "transforms"]
net = []
email = ["dep:lettre"]
sql = ["dep:sqlx", "dep:tokio"]
surreal = ["dep:surrealdb", "dep:tokio"]
full = ["host", "data", "pdf", "image", "plot", "media"]
data = ["dep:polars"]
pdf = []
image = []
plot = []
media = []

[dependencies]
serde_json = "1.0"
csv = { version = "1.3", optional = true }
serde_yaml = { version = "0.9", optional = true }
ehttp = { version = "0.7.1", optional = true }
html-to-markdown-rs = { version = "3.4.0", optional = true, features = ["serde"] }
tokio = { version = "1.48", optional = true, features = ["rt", "time", "net"] }
websearch = { version = "0.1.1", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres", "json"] }
surrealdb = { version = "3.0.5", optional = true, default-features = false, features = ["protocol-http", "rustls"] }
polars = { version = "0.46", optional = true, default-features = false, features = ["csv", "fmt"] }

[dev-dependencies]
grapheme-signatures = { path = "../grapheme-signatures", version = "0.6.1", features = ["full"] }
tempfile = "3.20"
