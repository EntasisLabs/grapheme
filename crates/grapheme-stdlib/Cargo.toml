[package]
name = "grapheme-stdlib"
version = "0.6.1"
edition = "2021"
description = "Standard library operation implementations for Grapheme"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[features]
default = []
full = ["data", "pdf", "image", "plot", "media"]
data = ["dep:polars"]
pdf = []
image = []
plot = []
media = []

[dependencies]
serde_json = "1.0"
csv = "1.3"
serde_yaml = "0.9"
ehttp = "0.7.1"
html-to-markdown-rs = { version = "3.4.0", features = ["serde"] }
tokio = { version = "1.48", features = ["rt", "time", "net"] }
websearch = "0.1.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "postgres", "json"] }
surrealdb = { version = "3.0.5", default-features = false, features = ["protocol-http", "rustls"] }
polars = { version = "0.46", optional = true, default-features = false, features = ["csv", "fmt"] }

[dev-dependencies]
grapheme-signatures = { path = "../grapheme-signatures", version = "0.6.1", features = ["full"] }
tempfile = "3.20"
