[package]
name = "grapheme-wasm"
version = "0.7.1"
edition = "2024"
rust-version = "1.92"
description = "WASI compile+execute engine: Grapheme runtime running in Wasm"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme-wasm"
path = "src/main.rs"

[lib]
name = "grapheme_wasm"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.3.0" }
grapheme-compiler = { path = "../grapheme-compiler", version = "0.7.1", default-features = false }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.7.1", default-features = false }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.7.1", default-features = false, features = ["wasm"] }
