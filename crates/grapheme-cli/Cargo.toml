[package]
name = "grapheme-cli"
version = "0.6.0"
edition = "2021"
description = "Grapheme CLI for parsing, compiling, and running .gr workflows"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[features]
default = ["full"]
full = [
    "grapheme-stdlib/full",
    "grapheme-sdk/full",
    "grapheme-compiler/full",
    "grapheme-runtime/full",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
grapheme-compiler = { path = "../grapheme-compiler", version = "0.5.0", default-features = false, features = ["full"] }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.5.0", default-features = false, features = ["wasix-runtime", "full"] }
grapheme-artifact = { path = "../grapheme-artifact", version = "0.2.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.5.0", features = ["full"] }
grapheme-sdk = { path = "../grapheme-sdk", version = "0.6.0", default-features = false, features = ["full"] }
