[package]
name = "grapheme"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ehttp = "0.7.1"
html-to-markdown-rs = { version = "3.4.0", features = ["serde"] }
csv = "1.3"
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["rt", "time", "net"] }
websearch = "0.1.1"
grapheme-compiler = { path = "../grapheme-compiler" }
grapheme-runtime = { path = "../grapheme-runtime", features = ["wasix-runtime"] }
grapheme-artifact = { path = "../grapheme-artifact" }
