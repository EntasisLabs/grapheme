[package]
name = "grapheme"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
grapheme-compiler = { path = "../grapheme-compiler" }
grapheme-runtime = { path = "../grapheme-runtime", features = ["wasix-runtime"] }
grapheme-artifact = { path = "../grapheme-artifact" }
grapheme-stdlib = { path = "../grapheme-stdlib" }
grapheme-sdk = { path = "../grapheme-sdk" }
