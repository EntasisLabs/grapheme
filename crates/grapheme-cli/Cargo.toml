[package]
name = "grapheme-cli"
version = "0.10.0"
edition = "2024"
# Headless default stays on the workspace MSRV. Cargo has no per-feature
# rust-version: `--features ui` needs Rust 1.95 because grapheme-ui does.
# That floor is the CLI UI job. This field stays 1.94 so `cargo install
# grapheme-cli` (no features) still builds on 1.94.
rust-version = "1.94"
description = "Grapheme CLI for parsing, compiling, and running .gr workflows"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[features]
default = ["full"]
full = [
    "grapheme-stdlib/full",
    "grapheme-sdk/full",
    "grapheme-compiler/full",
    "grapheme-runtime/full",
]
# Run UI glyph files in-process: `grapheme run app.gr` opens a window.
# Pulls grapheme-ui (rust-version 1.95) and its rndr/winit/wgpu window stack.
# Off by default so a plain install stays headless and on Rust 1.94.
# `cargo install grapheme-cli --features ui` needs Rust 1.95+.
ui = ["dep:grapheme-ui", "grapheme-ui/desktop", "dep:notify", "dep:rndr_core"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
grapheme-compiler = { path = "../grapheme-compiler", version = "0.10.0", default-features = false, features = ["full"] }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.10.0", default-features = false, features = ["wasix-runtime", "full"] }
grapheme-artifact = { path = "../grapheme-artifact", version = "0.5.0" }
grapheme-aot-container = { path = "../grapheme-aot-container", version = "0.10.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.10.0", features = ["full"] }
grapheme-sdk = { path = "../grapheme-sdk", version = "0.10.0", default-features = false, features = ["full"] }
# Optional: only the `ui` feature links it. grapheme-ui depends on the
# grapheme-* crates from crates.io; the workspace `[patch.crates-io]` maps
# them back to these paths so the binary carries one runtime.
grapheme-ui = { version = "0.2.0", optional = true }
notify = { version = "6.1.1", optional = true }
rndr_core = { version = "0.6.0", optional = true }
