[package]
name = "grapheme-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
description = "Grapheme CLI for parsing, compiling, and running .gr workflows"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[features]
default = ["full"]
full = [
    "grapheme-stdlib/full",
    "grapheme-sdk/full",
    "grapheme-compiler/full",
    "grapheme-runtime/full",
]
# Run UI glyph files in-process: `grapheme run app.gr` opens a window.
# Pulls grapheme-ui and its rndr/winit/wgpu window stack. Off by default so a
# plain install stays headless. `cargo install grapheme-cli --features ui`.
ui = ["dep:grapheme-ui", "grapheme-ui/desktop"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
grapheme-compiler = { path = "../grapheme-compiler", version = "0.9.0", default-features = false, features = ["full"] }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.9.0", default-features = false, features = ["wasix-runtime", "full"] }
grapheme-artifact = { path = "../grapheme-artifact", version = "0.5.0" }
grapheme-aot-container = { path = "../grapheme-aot-container", version = "0.9.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.9.0", features = ["full"] }
grapheme-sdk = { path = "../grapheme-sdk", version = "0.9.0", default-features = false, features = ["full"] }
# Optional: only the `ui` feature links it. grapheme-ui depends on the
# grapheme-* crates from crates.io; the workspace `[patch.crates-io]` maps
# them back to these paths so the binary carries one runtime.
grapheme-ui = { git = "https://github.com/EntasisLabs/grapheme-ui", branch = "main", version = "0.1.0", optional = true }
