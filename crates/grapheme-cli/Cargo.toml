[package]
name = "grapheme"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ehttp = "0.7.1"
grapheme-compiler = { path = "../grapheme-compiler" }
grapheme-runtime = { path = "../grapheme-runtime", features = ["wasix-runtime"] }
grapheme-artifact = { path = "../grapheme-artifact" }
