[package]
name = "grapheme-cli"
version = "0.5.0"
edition = "2021"
description = "Grapheme CLI for parsing, compiling, and running .gr workflows"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
grapheme-compiler = { path = "../grapheme-compiler", version = "0.4.0" }
grapheme-runtime = { path = "../grapheme-runtime", version = "0.4.0", features = ["wasix-runtime"] }
grapheme-artifact = { path = "../grapheme-artifact", version = "0.2.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.4.0" }
grapheme-sdk = { path = "../grapheme-sdk", version = "0.4.0" }
