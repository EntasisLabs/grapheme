[package]
name = "grapheme-aot-container"
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
description = "Stage B AOT workflow container: slim MIR walker for wasm32-wasip1"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme-aot-container"
path = "src/main.rs"

[lib]
name = "grapheme_aot_container"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
grapheme-artifact = { path = "../grapheme-artifact", version = "0.2.0" }
grapheme-stdlib = { path = "../grapheme-stdlib", version = "0.6.1", default-features = false, features = ["wasm"] }
