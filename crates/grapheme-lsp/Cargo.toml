[package]
name = "grapheme-lsp"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
description = "Language Server Protocol implementation for Grapheme"
license = "Apache-2.0"
repository = "https://github.com/entasislabs/grapheme"
homepage = "https://github.com/entasislabs/grapheme"

[[bin]]
name = "grapheme-lsp"
path = "src/main.rs"

[features]
default = ["full"]
full = ["grapheme-signatures/full", "grapheme-compiler/full"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"
grapheme-compiler = { path = "../grapheme-compiler", version = "0.7.0", default-features = false, features = ["full"] }
grapheme-signatures = { path = "../grapheme-signatures", version = "0.7.0", default-features = false, features = ["full"] }
