[package]
name = "http-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "http-plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.3.0"
# RUSTSEC-2026-0381 / 0382. ureq 3.3 still allows webpki-roots 1.0.7 and
# rustls-webpki 0.103.13.
webpki-roots = "1.0.10"
rustls-webpki = { version = "0.103.16", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
