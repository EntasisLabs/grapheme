[package]
name = "image-plugin"
version = "0.1.0"
edition = "2021"
description = "Grapheme reference Wasm image capability plugin"

[[bin]]
name = "image-plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
