name: Deploy site to GitHub Pages

# Builds the SvelteKit site in `site/` (landing, docs, in-browser WASM
# playground) and publishes it to GitHub Pages on every push to main.
#
# Live at: https://grapheme-lang.org/ (custom domain; the old project-site
# URL https://entasislabs.github.io/grapheme/ redirects there).
#
# The base path comes from actions/configure-pages: "" with the custom domain
# attached, "/grapheme" if it is ever removed. The origin used for canonical /
# Open Graph URLs is pinned to https://grapheme-lang.org because configure-pages
# reports the Pages `html_url`, which is `http://` until "Enforce HTTPS" is on.
# See site/README.md ("Deploy") for details and the custom-domain / DNS steps.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-flight deploys finish so Pages never ends
# up half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails with "Get Pages site failed" until Pages is enabled once in
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # (Auto-enablement needs a PAT; GITHUB_TOKEN cannot create the site.)
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Only the wasm engine is built here; keep this cache separate from
          # the conformance workflow's native/test cache.
          key: pages-wasm

      - name: Build grapheme-wasm (WASI engine for the playground)
        run: |
          ./scripts/build-runtime-wasm.sh
          wasm="target/wasm32-wasip1/release/grapheme-wasm.wasm"
          if [[ ! -s "$wasm" ]]; then
            echo "::error::grapheme-wasm.wasm was not produced at $wasm" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          # `` with the custom domain attached; `/grapheme` for the bare
          # project site. Always taken from configure-pages, never hardcoded.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Scheme + host used for canonical and Open Graph URLs. Pinned to
          # https:// rather than `steps.pages.outputs.origin`, which follows
          # the Pages `html_url` and stays `http://` until Enforce HTTPS is on.
          PUBLIC_SITE_URL: https://grapheme-lang.org
        run: |
          echo "BASE_PATH=${BASE_PATH:-<root>}  PUBLIC_SITE_URL=$PUBLIC_SITE_URL"
          npm run build

      - name: Verify build output
        working-directory: site
        run: |
          set -euo pipefail
          test -f build/index.html || { echo "::error::build/index.html missing" >&2; exit 1; }
          test -f build/404.html || { echo "::error::build/404.html (SPA fallback) missing" >&2; exit 1; }
          # The Pages artifact must carry CNAME or the custom domain is dropped on deploy.
          test -f build/CNAME || { echo "::error::build/CNAME missing (static/CNAME not copied): the custom domain would be detached by this deploy" >&2; exit 1; }
          [[ "$(tr -d '[:space:]' < build/CNAME)" == "grapheme-lang.org" ]] || { echo "::error::build/CNAME is not 'grapheme-lang.org' (got '$(cat build/CNAME)')" >&2; exit 1; }
          if [[ ! -s build/grapheme-wasm.wasm ]]; then
            echo "::error::build/grapheme-wasm.wasm missing: sync-wasm did not pick up the WASI build, the playground would be broken" >&2
            exit 1
          fi
          echo "wasm: $(wc -c < build/grapheme-wasm.wasm) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
