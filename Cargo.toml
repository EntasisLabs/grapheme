[workspace]
members = [
	"crates/grapheme-artifact",
	"crates/grapheme-signatures",
	"crates/grapheme-stdlib",
	"crates/grapheme-compiler",
	"crates/grapheme-runtime",
	"crates/grapheme-sdk",
	"crates/grapheme-cli",
	"crates/grapheme-lsp",
	"crates/grapheme-aot-container",
	"crates/grapheme-wasm",
]
exclude = ["plugins/core-echo-rs", "plugins/io-rs", "plugins/http-rs", "plugins/memory-rs", "plugins/tcp-rs", "plugins/smtp-rs", "plugins/secrets-rs", "plugins/docs-rs", "plugins/pdf-rs", "plugins/image-rs", "plugins/plot-rs"]
default-members = ["crates/grapheme-cli"]
resolver = "2"

# grapheme-cli's optional `ui` feature depends on grapheme-ui, which depends on
# grapheme-* from crates.io. Point those back at the workspace crates so the
# CLI links a single copy of the runtime. Only applies while the workspace
# versions satisfy grapheme-ui's requirement (^0.9.0 today); bump grapheme-ui
# in lockstep with a grapheme minor release.
[patch.crates-io]
grapheme-artifact = { path = "crates/grapheme-artifact" }
grapheme-signatures = { path = "crates/grapheme-signatures" }
grapheme-stdlib = { path = "crates/grapheme-stdlib" }
grapheme-compiler = { path = "crates/grapheme-compiler" }
grapheme-runtime = { path = "crates/grapheme-runtime" }
grapheme-sdk = { path = "crates/grapheme-sdk" }
grapheme-aot-container = { path = "crates/grapheme-aot-container" }

[workspace.package]
edition = "2024"
rust-version = "1.94"

[profile.release.package.grapheme-aot-container]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.grapheme-wasm]
opt-level = "z"
codegen-units = 1
strip = true
